# Default DeepSeek official API patch. maxTokens is per request, not a task budget.
# No models list: the built-in catalog (flash, v4-pro) stays, so any official model picked in DSH Desktop works.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com/anthropic
    thinking: enabled
    reasoningEffort: high
    maxTokens: 32768
    streamIdleTimeoutMs: 120000
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: session-title-llm
  disabled: true
- id: llm-retry
  disabled: true
